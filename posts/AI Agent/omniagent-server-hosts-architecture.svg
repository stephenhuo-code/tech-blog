<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1000" viewBox="0 0 1640 1000" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="aD" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#555"/></marker>
    <marker id="aDs" markerWidth="10" markerHeight="10" refX="2" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M8,0 L0,3 L8,6 z" fill="#555"/></marker>
    <marker id="aB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#6c8ebf"/></marker>
    <marker id="aBs" markerWidth="10" markerHeight="10" refX="2" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M8,0 L0,3 L8,6 z" fill="#6c8ebf"/></marker>
    <marker id="aO" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#d79b00"/></marker>
    <marker id="aG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#82b366"/></marker>
    <marker id="aGs" markerWidth="10" markerHeight="10" refX="2" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M8,0 L0,3 L8,6 z" fill="#82b366"/></marker>
  </defs>
  <rect width="1640" height="1000" fill="#ffffff"/>

  <text x="820" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#222">Omnigent Server ↔ 多 Host 架构(自注册 host + Managed 云沙箱)</text>

  <!-- Web UI -->
  <rect x="40" y="180" width="170" height="100" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="125" y="212" font-size="12" font-weight="700" text-anchor="middle" fill="#7a5c00">🌐 Web UI / 客户端</text>
  <text x="125" y="234" font-size="10.5" text-anchor="middle" fill="#7a5c00">New Chat → 选机器</text>
  <text x="125" y="250" font-size="10.5" text-anchor="middle" fill="#7a5c00">(host picker)</text>
  <text x="125" y="268" font-size="10.5" text-anchor="middle" fill="#7a5c00">订阅 SSE /stream</text>

  <!-- Server group -->
  <rect x="300" y="100" width="900" height="430" rx="10" fill="#eef6ff" stroke="#6c8ebf" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="318" y="124" font-size="14" font-weight="700" fill="#2f5f8f">Omnigent Server(可多副本) — 端口 6767</text>

  <rect x="330" y="150" width="240" height="80" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.4"/>
  <text x="450" y="178" font-size="12" font-weight="700" text-anchor="middle" fill="#23476b">REST API</text>
  <text x="450" y="198" font-size="10" text-anchor="middle" fill="#23476b">POST /v1/sessions</text>
  <text x="450" y="214" font-size="10" text-anchor="middle" fill="#23476b">GET /v1/hosts (picker)</text>

  <rect x="600" y="150" width="270" height="80" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.4"/>
  <text x="735" y="174" font-size="12" font-weight="700" text-anchor="middle" fill="#23476b">Tunnel 端点</text>
  <text x="735" y="194" font-size="10" text-anchor="middle" fill="#23476b">/v1/hosts/{id}/tunnel</text>
  <text x="735" y="210" font-size="10" text-anchor="middle" fill="#23476b">sender · receiver · ping 任务</text>

  <rect x="900" y="150" width="270" height="80" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.4"/>
  <text x="1035" y="174" font-size="12" font-weight="700" text-anchor="middle" fill="#7a4a00">resolve_host_launch</text>
  <text x="1035" y="194" font-size="10" text-anchor="middle" fill="#7a4a00">校验:拥有 host + 在线</text>
  <text x="1035" y="210" font-size="10" text-anchor="middle" fill="#7a4a00">+ 拥有 session(否则 403/409）</text>

  <rect x="330" y="270" width="300" height="90" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.4"/>
  <text x="480" y="296" font-size="12" font-weight="700" text-anchor="middle" fill="#5b3d6b">HostRegistry(内存 · 每副本)</text>
  <text x="480" y="316" font-size="10" text-anchor="middle" fill="#5b3d6b">host_id → HostConnection(ws)</text>
  <text x="480" y="332" font-size="10" text-anchor="middle" fill="#5b3d6b">pending_launches / stops / stats</text>
  <text x="480" y="348" font-size="10" text-anchor="middle" fill="#5b3d6b">仅本副本的活连接</text>

  <rect x="660" y="270" width="300" height="90" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.4"/>
  <text x="810" y="296" font-size="12" font-weight="700" text-anchor="middle" fill="#7a4a00">managed_hosts.launch</text>
  <text x="810" y="316" font-size="10" text-anchor="middle" fill="#7a4a00">provision 沙箱 · 发 per-launch token</text>
  <text x="810" y="332" font-size="10" text-anchor="middle" fill="#7a4a00">起 omnigent host · 等连回 online</text>
  <text x="810" y="348" font-size="10" text-anchor="middle" fill="#7a4a00">一 session 一沙箱(无池化)</text>

  <!-- hosts DB cylinder -->
  <path d="M620,412 a160,14 0 0,0 320,0 v82 a160,14 0 0,1 -320,0 z" fill="#f5f5f5" stroke="#666" stroke-width="1.5"/>
  <ellipse cx="780" cy="412" rx="160" ry="14" fill="#f5f5f5" stroke="#666" stroke-width="1.5"/>
  <text x="780" y="438" font-size="12" font-weight="700" text-anchor="middle" fill="#444">hosts 表(跨副本真相源)</text>
  <text x="780" y="456" font-size="10" text-anchor="middle" fill="#444">host_id / owner / status / updated_at</text>
  <text x="780" y="472" font-size="10" text-anchor="middle" fill="#444">token_hash / sandbox_id（managed）</text>
  <text x="780" y="490" font-size="9.5" text-anchor="middle" fill="#888">存活 = online 且 updated_at ≥ now-90s</text>

  <!-- Self-registered hosts group -->
  <rect x="120" y="600" width="630" height="370" rx="10" fill="#eafaef" stroke="#82b366" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="138" y="624" font-size="13" font-weight="700" fill="#3f6b32">自注册 host —— host 主动 outbound 连接(omnigent host),server 不启动它们</text>

  <!-- Host A -->
  <rect x="150" y="648" width="270" height="300" rx="8" fill="#ffffff" stroke="#82b366" stroke-width="1.3"/>
  <text x="285" y="672" font-size="11.5" font-weight="700" text-anchor="middle" fill="#3f6b32">Host A(owner: alice · 用户机器)</text>
  <rect x="170" y="688" width="230" height="44" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/>
  <text x="285" y="715" font-size="10.5" font-weight="600" text-anchor="middle" fill="#3f6b32">host daemon (connect.py)</text>
  <rect x="170" y="746" width="230" height="190" rx="6" fill="#f4fbf2" stroke="#9ec78a" stroke-width="1.1"/>
  <text x="285" y="768" font-size="10.5" font-weight="700" text-anchor="middle" fill="#3f6b32">self._runners {} — 多 runner 子进程</text>
  <rect x="186" y="784" width="198" height="40" rx="5" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
  <text x="285" y="800" font-size="9.5" text-anchor="middle" fill="#3f6b32">runner ▸ session-1</text>
  <text x="285" y="814" font-size="9" text-anchor="middle" fill="#6f9960">(自己的 git worktree)</text>
  <rect x="186" y="832" width="198" height="40" rx="5" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
  <text x="285" y="848" font-size="9.5" text-anchor="middle" fill="#3f6b32">runner ▸ session-2</text>
  <text x="285" y="862" font-size="9" text-anchor="middle" fill="#6f9960">(自己的 git worktree)</text>
  <text x="285" y="900" font-size="9.5" text-anchor="middle" fill="#888">同 OS 用户 alice · 一 host 可多 session</text>
  <text x="285" y="916" font-size="9.5" text-anchor="middle" fill="#888">凭证白名单注入(不泄漏个人密钥)</text>

  <!-- Host B -->
  <rect x="445" y="648" width="285" height="300" rx="8" fill="#ffffff" stroke="#82b366" stroke-width="1.3"/>
  <text x="587" y="672" font-size="11.5" font-weight="700" text-anchor="middle" fill="#3f6b32">Host B(owner: bob)</text>
  <rect x="465" y="688" width="245" height="44" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/>
  <text x="587" y="715" font-size="10.5" font-weight="600" text-anchor="middle" fill="#3f6b32">host daemon</text>
  <rect x="465" y="746" width="245" height="60" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
  <text x="587" y="772" font-size="9.5" text-anchor="middle" fill="#3f6b32">runner ▸ session-3</text>
  <text x="587" y="788" font-size="9" text-anchor="middle" fill="#6f9960">(worktree)</text>
  <text x="587" y="838" font-size="10" text-anchor="middle" fill="#888">bob 只能看到/派发自己的 host</text>
  <text x="587" y="856" font-size="10" text-anchor="middle" fill="#888">(host = owner 的信任边界)</text>

  <!-- Managed hosts group -->
  <rect x="820" y="600" width="730" height="370" rx="10" fill="#fff7ec" stroke="#d79b00" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="838" y="624" font-size="13" font-weight="700" fill="#9a6b00">Managed host —— server 按需 provision(Modal / Daytona),一 session 一沙箱</text>

  <!-- Sandbox 1 -->
  <rect x="850" y="648" width="320" height="300" rx="8" fill="#ffffff" stroke="#d79b00" stroke-width="1.3"/>
  <text x="1010" y="672" font-size="11.5" font-weight="700" text-anchor="middle" fill="#9a6b00">☁️ 云沙箱 #1(session X)</text>
  <rect x="872" y="688" width="276" height="44" rx="6" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2"/>
  <text x="1010" y="715" font-size="10.5" font-weight="600" text-anchor="middle" fill="#7a4a00">host daemon(沙箱内)</text>
  <rect x="872" y="746" width="276" height="56" rx="6" fill="#ffe6cc" stroke="#d79b00" stroke-width="1"/>
  <text x="1010" y="770" font-size="9.5" text-anchor="middle" fill="#7a4a00">runner ▸ session X(worktree）</text>
  <text x="1010" y="785" font-size="9" text-anchor="middle" fill="#b58a3a">隔离 VM / 容器</text>
  <text x="1010" y="828" font-size="9.5" text-anchor="middle" fill="#888">per-launch token(SHA-256 存哈希)</text>
  <text x="1010" y="846" font-size="9.5" text-anchor="middle" fill="#888">session 删除 → 沙箱销毁</text>
  <text x="1010" y="864" font-size="9.5" text-anchor="middle" fill="#888">沙箱挂了 relaunch:复用 host_id,换 token</text>

  <!-- Sandbox 2 -->
  <rect x="1195" y="648" width="330" height="300" rx="8" fill="#ffffff" stroke="#d79b00" stroke-width="1.3"/>
  <text x="1360" y="672" font-size="11.5" font-weight="700" text-anchor="middle" fill="#9a6b00">☁️ 云沙箱 #2(session Y)</text>
  <rect x="1217" y="688" width="286" height="44" rx="6" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2"/>
  <text x="1360" y="715" font-size="10.5" font-weight="600" text-anchor="middle" fill="#7a4a00">host daemon(沙箱内)</text>
  <rect x="1217" y="746" width="286" height="56" rx="6" fill="#ffe6cc" stroke="#d79b00" stroke-width="1"/>
  <text x="1360" y="770" font-size="9.5" text-anchor="middle" fill="#7a4a00">runner ▸ session Y(worktree）</text>
  <text x="1360" y="785" font-size="9" text-anchor="middle" fill="#b58a3a">隔离 VM / 容器</text>
  <text x="1360" y="840" font-size="9.5" text-anchor="middle" fill="#888">每会话各一沙箱 → 强隔离</text>
  <text x="1360" y="858" font-size="9.5" text-anchor="middle" fill="#888">对用户透明(不进 picker)</text>

  <!-- ===== EDGES ===== -->
  <!-- WebUI -> REST -->
  <path d="M210,210 H270 V190 H330" fill="none" stroke="#555" stroke-width="2" marker-end="url(#aD)"/>
  <rect x="215" y="172" width="110" height="15" fill="#fff" opacity="0.85"/>
  <text x="270" y="184" font-size="9.5" text-anchor="middle" fill="#555">建会话 / 选机器</text>

  <!-- REST -> resolve -->
  <path d="M570,210 H900" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#aD)"/>
  <rect x="640" y="192" width="180" height="15" fill="#fff" opacity="0.85"/>
  <text x="730" y="204" font-size="9.5" text-anchor="middle" fill="#555">起 session → 选 host → launch</text>

  <!-- resolve -> tunnel (send launch frame) -->
  <path d="M900,178 H872" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#aD)"/>
  <rect x="700" y="138" width="190" height="15" fill="#fff" opacity="0.85"/>
  <text x="795" y="150" font-size="9.5" text-anchor="middle" fill="#555">取活连接 → 发 launch_runner 帧</text>

  <!-- tunnel <-> registry -->
  <path d="M680,230 V250 H480 V270" fill="none" stroke="#9673a6" stroke-width="1.8" marker-end="url(#aB)"/>
  <rect x="500" y="244" width="150" height="15" fill="#fff" opacity="0.85"/>
  <text x="575" y="256" font-size="9.5" text-anchor="middle" fill="#7a5c8f">register / deregister</text>

  <!-- registry <-> db -->
  <path d="M480,360 V388 H700" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#aD)" marker-start="url(#aDs)"/>
  <rect x="490" y="372" width="200" height="15" fill="#fff" opacity="0.9"/>
  <text x="590" y="384" font-size="9.5" text-anchor="middle" fill="#555">upsert / heartbeat / set_offline</text>

  <!-- launcher -> db -->
  <path d="M860,360 V392 H840" fill="none" stroke="#d79b00" stroke-width="1.8" marker-end="url(#aO)"/>
  <rect x="845" y="368" width="180" height="15" fill="#fff" opacity="0.9"/>
  <text x="935" y="380" font-size="9.5" text-anchor="middle" fill="#9a6b00">register_managed_host(token)</text>

  <!-- Host A daemon <-> server (WS tunnel) -->
  <path d="M260,688 V534" fill="none" stroke="#6c8ebf" stroke-width="2.4" stroke-dasharray="2 0" marker-end="url(#aB)" marker-start="url(#aBs)"/>
  <rect x="92" y="556" width="230" height="46" fill="#fff" opacity="0.92"/>
  <text x="207" y="570" font-size="9.5" text-anchor="middle" fill="#2f5f8f">WS 隧道 ⇅ (outbound)</text>
  <text x="207" y="584" font-size="9.5" text-anchor="middle" fill="#2f5f8f">hello / launch / stop / ping 帧</text>
  <text x="207" y="598" font-size="9.5" text-anchor="middle" fill="#2f5f8f">30s ping · 90s 心跳判活</text>

  <!-- Host B daemon -> server (WS) -->
  <path d="M587,688 V534" fill="none" stroke="#6c8ebf" stroke-width="2.4" marker-end="url(#aB)" marker-start="url(#aBs)"/>
  <rect x="540" y="560" width="95" height="15" fill="#fff" opacity="0.92"/>
  <text x="587" y="572" font-size="9.5" text-anchor="middle" fill="#2f5f8f">WS 隧道 ⇅</text>

  <!-- launcher -> sandbox (provision) -->
  <path d="M935,360 V560 H1010 V648" fill="none" stroke="#d79b00" stroke-width="2.2" marker-end="url(#aO)"/>
  <rect x="980" y="508" width="290" height="46" fill="#fff" opacity="0.92"/>
  <text x="1125" y="522" font-size="9.5" text-anchor="middle" fill="#9a6b00">① provision 沙箱 + 起 omnigent host</text>
  <text x="1125" y="536" font-size="9.5" text-anchor="middle" fill="#9a6b00">(注入 token / host_id / server_url)</text>
  <text x="1125" y="550" font-size="9.5" text-anchor="middle" fill="#9a6b00">一 session 一沙箱</text>

  <!-- sandbox1 -> server (WS connect back) -->
  <path d="M1110,688 V534" fill="none" stroke="#6c8ebf" stroke-width="2.4" marker-end="url(#aB)" marker-start="url(#aBs)"/>
  <rect x="1115" y="558" width="170" height="30" fill="#fff" opacity="0.92"/>
  <text x="1200" y="570" font-size="9.5" text-anchor="middle" fill="#2f5f8f">② WS 连回(token 鉴权)</text>
  <text x="1200" y="584" font-size="9.5" text-anchor="middle" fill="#2f5f8f">→ upsert_on_connect</text>

  <!-- sandbox2 -> server (WS) -->
  <path d="M1360,688 V534" fill="none" stroke="#6c8ebf" stroke-width="2.4" marker-end="url(#aB)" marker-start="url(#aBs)"/>
  <rect x="1318" y="560" width="84" height="15" fill="#fff" opacity="0.92"/>
  <text x="1360" y="572" font-size="9.5" text-anchor="middle" fill="#2f5f8f">WS 连回</text>

  <!-- legend -->
  <rect x="40" y="320" width="225" height="120" rx="6" fill="#fbfbfb" stroke="#bbb" stroke-width="1"/>
  <text x="52" y="340" font-size="10.5" font-weight="700" fill="#444">图例</text>
  <line x1="52" y1="356" x2="92" y2="356" stroke="#6c8ebf" stroke-width="2.4" marker-end="url(#aB)" marker-start="url(#aBs)"/>
  <text x="100" y="360" font-size="9.5" fill="#444">WS 隧道(双向帧 + 心跳)</text>
  <line x1="52" y1="378" x2="92" y2="378" stroke="#d79b00" stroke-width="2.2" marker-end="url(#aO)"/>
  <text x="100" y="382" font-size="9.5" fill="#444">server 主动 provision / 写库</text>
  <line x1="52" y1="400" x2="92" y2="400" stroke="#555" stroke-width="1.8" marker-end="url(#aD)"/>
  <text x="100" y="404" font-size="9.5" fill="#444">HTTP / 内部调用</text>
  <text x="52" y="426" font-size="9" fill="#888">自注册=host 连上来 · managed=server 启</text>

</svg>
