<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="940" viewBox="0 0 1520 940" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#555"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#82b366"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#6c8ebf"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
    <marker id="arrY" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#d6b656"/>
    </marker>
    <marker id="arrYs" markerWidth="10" markerHeight="10" refX="2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M8,0 L0,3 L8,6 z" fill="#d6b656"/>
    </marker>
    <marker id="arrGs" markerWidth="10" markerHeight="10" refX="2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M8,0 L0,3 L8,6 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="1520" height="940" fill="#ffffff"/>

  <!-- title -->
  <text x="760" y="42" font-size="22" font-weight="700" text-anchor="middle" fill="#222">Polly 编程模型架构 — Orchestrator / Worker 多 Agent</text>

  <!-- Human actor -->
  <g>
    <circle cx="140" cy="160" r="12" fill="none" stroke="#d6b656" stroke-width="2"/>
    <line x1="140" y1="172" x2="140" y2="200" stroke="#d6b656" stroke-width="2"/>
    <line x1="122" y1="182" x2="158" y2="182" stroke="#d6b656" stroke-width="2"/>
    <line x1="140" y1="200" x2="126" y2="220" stroke="#d6b656" stroke-width="2"/>
    <line x1="140" y1="200" x2="154" y2="220" stroke="#d6b656" stroke-width="2"/>
    <text x="140" y="240" font-size="12" font-weight="600" text-anchor="middle" fill="#7a5c00">👤 Human</text>
    <text x="140" y="256" font-size="10" text-anchor="middle" fill="#7a5c00">目标 / plan gate</text>
    <text x="140" y="270" font-size="10" text-anchor="middle" fill="#7a5c00">审阅 &amp; 合并 PR</text>
  </g>

  <!-- Orchestrator group -->
  <rect x="300" y="90" width="860" height="190" rx="10" fill="#fff7ec" stroke="#d79b00" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="318" y="112" font-size="13" font-weight="700" fill="#9a6b00">Polly 大脑 (Orchestrator) — harness: claude-sdk · context 1M · 不写代码</text>

  <rect x="330" y="135" width="240" height="120" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
  <text x="450" y="170" font-size="13" font-weight="700" text-anchor="middle" fill="#7a4a00">🧠 Polly Brain</text>
  <text x="450" y="192" font-size="11" text-anchor="middle" fill="#7a4a00">拆解 · 分派 · 验证 · 集成</text>
  <text x="450" y="210" font-size="11" text-anchor="middle" fill="#7a4a00">文档 / skill 直写</text>

  <rect x="600" y="135" width="250" height="120" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="725" y="166" font-size="12" font-weight="700" text-anchor="middle" fill="#23476b">编排工具</text>
  <text x="725" y="186" font-size="10.5" text-anchor="middle" fill="#23476b">sys_session_send</text>
  <text x="725" y="202" font-size="10.5" text-anchor="middle" fill="#23476b">sys_read_inbox · sys_cancel_task</text>
  <text x="725" y="218" font-size="10.5" text-anchor="middle" fill="#23476b">sys_os_* · gh CLI</text>

  <rect x="880" y="135" width="250" height="120" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="1005" y="172" font-size="12" font-weight="700" text-anchor="middle" fill="#5b3d6b">Skills (可组合)</text>
  <text x="1005" y="194" font-size="11" text-anchor="middle" fill="#5b3d6b">investigate · fanout</text>
  <text x="1005" y="210" font-size="11" text-anchor="middle" fill="#5b3d6b">cross-review</text>

  <!-- Registry cylinder -->
  <g>
    <path d="M1260,152 a90,12 0 0,0 180,0 v76 a90,12 0 0,1 -180,0 z" fill="#f5f5f5" stroke="#666" stroke-width="1.5"/>
    <ellipse cx="1350" cy="152" rx="90" ry="12" fill="#f5f5f5" stroke="#666" stroke-width="1.5"/>
    <text x="1350" y="200" font-size="11" font-weight="600" text-anchor="middle" fill="#444">.polly/registry.json</text>
    <text x="1350" y="216" font-size="10" text-anchor="middle" fill="#444">任务 / worktree / PR 状态</text>
  </g>

  <!-- Dispatch note -->
  <g>
    <path d="M1260,300 h222 l18,18 v132 h-240 z" fill="#f5f5f5" stroke="#999" stroke-width="1.2"/>
    <path d="M1482,300 v18 h18 z" fill="#ddd" stroke="#999" stroke-width="1.2"/>
    <text x="1272" y="324" font-size="11.5" font-weight="700" fill="#333">Dispatch 协议</text>
    <text x="1272" y="344" font-size="10.5" fill="#333">sys_session_send(</text>
    <text x="1272" y="360" font-size="10.5" fill="#333">  title=任务名,</text>
    <text x="1272" y="376" font-size="10.5" fill="#333">  args.purpose,</text>
    <text x="1272" y="392" font-size="10.5" fill="#333">  args.model)</text>
    <text x="1272" y="412" font-size="10.5" fill="#333">purpose ∈ implement /</text>
    <text x="1272" y="428" font-size="10.5" fill="#333">review / explore / search</text>
  </g>

  <!-- Guardrails group -->
  <rect x="300" y="330" width="860" height="120" rx="10" fill="#fdecea" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="318" y="352" font-size="13" font-weight="700" fill="#8e3b34">Guardrails / Policies — runner 侧 tool gate (nessie)</text>

  <rect x="320" y="365" width="190" height="70" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.3"/>
  <text x="415" y="386" font-size="11" font-weight="700" text-anchor="middle" fill="#7a2f29">blast_radius</text>
  <text x="415" y="402" font-size="9.5" text-anchor="middle" fill="#7a2f29">gate_pushes:false</text>
  <text x="415" y="416" font-size="9.5" text-anchor="middle" fill="#7a2f29">DENY force-push /</text>
  <text x="415" y="429" font-size="9.5" text-anchor="middle" fill="#7a2f29">rm -rf / / hard-reset</text>

  <rect x="530" y="365" width="180" height="70" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.3"/>
  <text x="620" y="390" font-size="11" font-weight="700" text-anchor="middle" fill="#7a2f29">spawn_bounds</text>
  <text x="620" y="408" font-size="9.5" text-anchor="middle" fill="#7a2f29">max_dispatches</text>
  <text x="620" y="422" font-size="9.5" text-anchor="middle" fill="#7a2f29">_per_turn: 5</text>

  <rect x="730" y="365" width="210" height="70" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.3"/>
  <text x="835" y="390" font-size="11" font-weight="700" text-anchor="middle" fill="#7a2f29">purpose_guard</text>
  <text x="835" y="408" font-size="9.5" text-anchor="middle" fill="#7a2f29">allowed: implement /</text>
  <text x="835" y="422" font-size="9.5" text-anchor="middle" fill="#7a2f29">review / explore / search</text>

  <rect x="960" y="365" width="170" height="70" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.3"/>
  <text x="1045" y="390" font-size="11" font-weight="700" text-anchor="middle" fill="#7a2f29">ask_timeout</text>
  <text x="1045" y="408" font-size="9.5" text-anchor="middle" fill="#7a2f29">86400s</text>
  <text x="1045" y="422" font-size="9.5" text-anchor="middle" fill="#7a2f29">(1 天审批窗)</text>

  <!-- Workers group -->
  <rect x="300" y="500" width="860" height="200" rx="10" fill="#eef6ff" stroke="#6c8ebf" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="318" y="522" font-size="13" font-weight="700" fill="#2f5f8f">编码子 Agent (Workers) — 各自独立 git worktree (.worktrees/&lt;id&gt; · branch polly/&lt;id&gt;) · 自治跑到 green · 各开各的 PR</text>

  <rect x="330" y="560" width="240" height="110" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="450" y="590" font-size="12" font-weight="700" text-anchor="middle" fill="#23476b">claude_code</text>
  <text x="450" y="610" font-size="10" text-anchor="middle" fill="#23476b">harness: claude-native</text>
  <text x="450" y="625" font-size="10" text-anchor="middle" fill="#23476b">bypassPermissions</text>
  <text x="450" y="645" font-size="10" text-anchor="middle" fill="#23476b">主力实现:多文件 / 重构 / 测试</text>

  <rect x="600" y="560" width="240" height="110" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="720" y="595" font-size="12" font-weight="700" text-anchor="middle" fill="#3f6b32">codex</text>
  <text x="720" y="617" font-size="10" text-anchor="middle" fill="#3f6b32">harness: codex-native</text>
  <text x="720" y="635" font-size="10" text-anchor="middle" fill="#3f6b32">窄而明确的改动</text>

  <rect x="870" y="560" width="260" height="110" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="1000" y="592" font-size="12" font-weight="700" text-anchor="middle" fill="#5b3d6b">pi (headless)</text>
  <text x="1000" y="614" font-size="10" text-anchor="middle" fill="#5b3d6b">harness: pi · 任意 gateway 模型</text>
  <text x="1000" y="632" font-size="10" text-anchor="middle" fill="#5b3d6b">评审 / 探索专家 (read-mostly)</text>

  <!-- Cross-review note -->
  <g>
    <path d="M1260,500 h222 l18,18 v182 h-240 z" fill="#f5f5f5" stroke="#999" stroke-width="1.2"/>
    <path d="M1482,500 v18 h18 z" fill="#ddd" stroke="#999" stroke-width="1.2"/>
    <text x="1272" y="524" font-size="11.5" font-weight="700" fill="#333">跨厂商评审 (cross-review)</text>
    <text x="1272" y="548" font-size="10.5" fill="#333">Claude → codex / pi</text>
    <text x="1272" y="566" font-size="10.5" fill="#333">codex → claude / pi</text>
    <text x="1272" y="584" font-size="10.5" fill="#333">pi → claude / codex</text>
    <text x="1272" y="608" font-size="10.5" fill="#333">只给 diff + 验收契约,</text>
    <text x="1272" y="624" font-size="10.5" fill="#333">不指 worktree;</text>
    <text x="1272" y="642" font-size="10.5" fill="#333">reviewer 只报问题不改码</text>
  </g>

  <!-- PR output -->
  <rect x="620" y="780" width="260" height="70" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.8"/>
  <text x="750" y="810" font-size="13" font-weight="700" text-anchor="middle" fill="#3f6b32">PR (交付物)</text>
  <text x="750" y="830" font-size="10.5" text-anchor="middle" fill="#3f6b32">gates 绿 + 零 blocking → ready</text>

  <!-- EDGES -->
  <!-- human -> brain -->
  <path d="M170,195 H260 V195 Q260,195 270,195 H330" fill="none" stroke="#d6b656" stroke-width="2" marker-end="url(#arrY)"/>
  <rect x="190" y="176" width="120" height="16" fill="#ffffff" opacity="0.85"/>
  <text x="250" y="188" font-size="10" text-anchor="middle" fill="#7a5c00">目标 / plan gate 确认</text>

  <!-- skills <-> registry -->
  <path d="M1130,195 H1260" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrGs)" marker-start="url(#arrGs)"/>
  <rect x="1150" y="176" width="92" height="16" fill="#ffffff" opacity="0.85"/>
  <text x="1196" y="188" font-size="9.5" text-anchor="middle" fill="#444">读写状态</text>

  <!-- tools -> guardrails -->
  <path d="M725,255 V390" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)"/>
  <rect x="600" y="300" width="220" height="16" fill="#ffffff" opacity="0.9"/>
  <text x="710" y="312" font-size="10" text-anchor="middle" fill="#8e3b34">dispatch (每 tool_call 过 gate)</text>

  <!-- guardrails -> workers -->
  <path d="M730,450 V560" fill="none" stroke="#6c8ebf" stroke-width="2" marker-end="url(#arrB)"/>
  <rect x="610" y="470" width="260" height="30" fill="#ffffff" opacity="0.9"/>
  <text x="740" y="484" font-size="10" text-anchor="middle" fill="#2f5f8f">sys_session_send(purpose, model)</text>
  <text x="740" y="497" font-size="10" text-anchor="middle" fill="#2f5f8f">每 worker 一个 worktree</text>

  <!-- workers -> brain (inbox, left loop, dashed green) -->
  <path d="M300,600 H250 V255 H330" fill="none" stroke="#82b366" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrG)"/>
  <rect x="60" y="412" width="190" height="30" fill="#ffffff" opacity="0.9"/>
  <text x="155" y="426" font-size="9.5" text-anchor="middle" fill="#3f6b32">inbox 唤醒 (异步·事件驱动·不轮询)</text>
  <text x="155" y="439" font-size="9.5" text-anchor="middle" fill="#3f6b32">sys_read_inbox 收结构化结果</text>

  <!-- workers -> PR -->
  <path d="M720,700 V780" fill="none" stroke="#82b366" stroke-width="2" marker-end="url(#arrG)"/>
  <rect x="640" y="730" width="200" height="16" fill="#ffffff" opacity="0.9"/>
  <text x="740" y="742" font-size="10" text-anchor="middle" fill="#3f6b32">gh pr create (implementer 自开)</text>

  <!-- PR -> human -->
  <path d="M620,815 H140 V282" fill="none" stroke="#d6b656" stroke-width="2" marker-end="url(#arrY)"/>
  <rect x="300" y="797" width="260" height="16" fill="#ffffff" opacity="0.9"/>
  <text x="430" y="809" font-size="10" text-anchor="middle" fill="#7a5c00">人审阅 &amp; merge (Polly 永不 merge)</text>

</svg>
