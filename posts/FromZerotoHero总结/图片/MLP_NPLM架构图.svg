<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" font-family="-apple-system, 'Helvetica Neue', sans-serif">
  <style>
    .title { font-size: 16px; fill: #1a1a1a; font-weight: 700; text-anchor: middle; }
    .layer-label { font-size: 12px; fill: #444; }
    .code { font-size: 11px; fill: #1e6091; font-family: monospace; }
    .arrow { fill: none; stroke: #555; stroke-width: 1.5; marker-end: url(#arrow); }
    .arrow-thick { fill: none; stroke: #1e6091; stroke-width: 2.5; marker-end: url(#arrow-blue); }
    .input-cell { fill: #fff8e1; stroke: #f39c12; stroke-width: 2; }
    .emb-cell { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2; }
    .hidden { fill: #d6e6ff; stroke: #1e6091; stroke-width: 2; rx: 8; }
    .output { fill: #fde2e2; stroke: #c0392b; stroke-width: 2; rx: 8; }
    .table-c { fill: #fffaf0; stroke: #d68910; stroke-width: 2; rx: 4; }
    .label-text { font-size: 13px; fill: #1a1a1a; text-anchor: middle; font-weight: 600; }
    .small-text { font-size: 11px; fill: #555; text-anchor: middle; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e6091"/>
    </marker>
  </defs>

  <text x="400" y="30" class="title">Bengio 2003 NPLM 架构（Karpathy Makemore Part 2 复现）</text>

  <!-- Output layer (top) -->
  <rect x="270" y="60" width="260" height="50" class="output"/>
  <text x="400" y="82" class="label-text">softmax + cross_entropy(Y)</text>
  <text x="400" y="100" class="small-text">→ loss</text>

  <!-- Logits -->
  <rect x="290" y="140" width="220" height="40" class="hidden" fill="#fde2e2" stroke="#c0392b"/>
  <text x="400" y="164" class="label-text">logits [N, 27]</text>

  <text x="540" y="165" class="code">= h @ W2 + b2</text>

  <!-- arrow logits → loss -->
  <path d="M 400 140 L 400 110" class="arrow"/>

  <!-- Hidden layer -->
  <rect x="290" y="210" width="220" height="40" class="hidden"/>
  <text x="400" y="234" class="label-text">h = tanh(...) [N, 100]</text>

  <text x="540" y="235" class="code">= tanh(flat @ W1 + b1)</text>

  <!-- arrow h → logits -->
  <path d="M 400 210 L 400 180" class="arrow"/>

  <!-- Flat/concat -->
  <rect x="270" y="290" width="260" height="50" class="hidden" fill="#d6e6ff"/>
  <text x="400" y="312" class="label-text">flat [N, 6]</text>
  <text x="400" y="330" class="small-text">3 个 embedding 拼接 (concat)</text>

  <text x="540" y="318" class="code">= emb.view(-1, 6)</text>

  <!-- arrow flat → h -->
  <path d="M 400 290 L 400 250" class="arrow"/>

  <!-- Embeddings (3 vectors) -->
  <g>
    <!-- emb 1 -->
    <rect x="220" y="380" width="50" height="50" class="emb-cell"/>
    <text x="245" y="402" class="label-text" font-size="11">emb[c1]</text>
    <text x="245" y="418" class="small-text">[2]</text>
    <!-- emb 2 -->
    <rect x="375" y="380" width="50" height="50" class="emb-cell"/>
    <text x="400" y="402" class="label-text" font-size="11">emb[c2]</text>
    <text x="400" y="418" class="small-text">[2]</text>
    <!-- emb 3 -->
    <rect x="530" y="380" width="50" height="50" class="emb-cell"/>
    <text x="555" y="402" class="label-text" font-size="11">emb[c3]</text>
    <text x="555" y="418" class="small-text">[2]</text>
  </g>

  <text x="630" y="412" class="code">= C[X]</text>

  <!-- arrows embeddings → flat -->
  <path d="M 245 380 Q 280 360 320 340" class="arrow"/>
  <path d="M 400 380 L 400 340" class="arrow"/>
  <path d="M 555 380 Q 520 360 480 340" class="arrow"/>

  <!-- Lookup table C -->
  <rect x="160" y="480" width="480" height="60" class="table-c"/>
  <text x="400" y="503" class="label-text">查表 (lookup): embedding 表 C [27, 2]</text>
  <text x="400" y="522" class="small-text">每个字符 id 对应一行 2 维向量；C 是可学习参数</text>

  <!-- arrows from C up to each embedding -->
  <path d="M 245 480 L 245 430" class="arrow"/>
  <path d="M 400 480 L 400 430" class="arrow"/>
  <path d="M 555 480 L 555 430" class="arrow"/>

  <!-- Input indices -->
  <g>
    <rect x="220" y="590" width="50" height="40" class="input-cell"/>
    <text x="245" y="615" class="label-text" font-size="13">c1</text>
    <rect x="375" y="590" width="50" height="40" class="input-cell"/>
    <text x="400" y="615" class="label-text" font-size="13">c2</text>
    <rect x="530" y="590" width="50" height="40" class="input-cell"/>
    <text x="555" y="615" class="label-text" font-size="13">c3</text>
  </g>

  <!-- arrows indices → table -->
  <path d="M 245 590 L 245 540" class="arrow"/>
  <path d="M 400 590 L 400 540" class="arrow"/>
  <path d="M 555 590 L 555 540" class="arrow"/>

  <!-- Input label -->
  <text x="400" y="665" class="label-text" font-size="13">输入: X = [c1, c2, c3] (block_size = 3 个字符索引)</text>

  <!-- Bottom note -->
  <text x="400" y="700" class="small-text" font-size="12">
    数据流向：字符索引 → 查表得 embedding → 拼接 → tanh 隐层 → 输出 logits → 交叉熵 loss
  </text>
</svg>
