site_name: Stephen 技术博客
site_description: AI、云平台、数据平台与工程实践笔记
site_author: Stephen Huo

repo_url: https://github.com/your-github-username/tech-blog
repo_name: your-github-username/tech-blog


theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

nav:
  - 首页: index.md
  - 关于: about.md
  - 文章:
      - GitHub Wiki 适合做技术博客吗？: posts/github-wiki-vs-blog.md

markdown_extensions:
  - admonition
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
